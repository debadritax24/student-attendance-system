version: "3.8"

services:
  app:
    build: .
    container_name: attendify-app
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/attendify
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  mongodb:
    image: mongo:7
    container_name: attendify-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: --bind_ip_all

  redis:
    image: redis:7-alpine
    container_name: attendify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongodb_data:
  redis_data:
