<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance | Attendify</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="sidebar-brand">
        <div class="brand-icon">A</div>
        <h2>Attendify</h2>
    </div>

    <a href="dashboard.html" class="nav-item">
        📊 Dashboard
    </a>

    <a href="attendance.html" class="nav-item active">
        ✓ Attendance
    </a>

    <a href="student.html" class="nav-item">
        👥 Students
    </a>

    <a href="subjects.html" class="nav-item">
        📚 Subjects
    </a>

    <a href="reports.html" class="nav-item">
        📈 Reports
    </a>

    <a href="history.html" class="nav-item">
        🕒 History
    </a>

    <a href="profile.html" class="nav-item">
        👤 Profile
    </a>

    <a href="settings.html" class="nav-item">
        ⚙ Settings
    </a>

    <a href="#" onclick="logout()" class="nav-item">
        ⇥ Logout
    </a>

</aside>

<main class="main">

<header class="navbar">

    <button
        class="mobile-menu"
        onclick="toggleSidebar()">
        ☰
    </button>

    <div class="page-title">
        Mark Attendance
    </div>

    <div class="nav-right">

        <div class="notification">
            🔔
        </div>

        <div class="user">

            <div class="avatar">
                DG
            </div>

            <div class="user-info">
                <strong data-user-name>
                    Debadrita Goswami
                </strong>

                <small data-user-role>
                    CR
                </small>
            </div>

        </div>

    </div>

</header>

<section class="content">

<div class="page-header">

    <div>

        <h1>Mark Attendance</h1>

        <p>
            Record attendance for today's class.
        </p>

    </div>

</div>

<div class="card">

<div class="filters">

    <div>
        <label>Date</label>
        <input
            type="date"
            id="attendanceDate"
            class="form-control"
        >
    </div>

    <div>
        <label>Subject</label>

        <select
            id="subject"
            class="form-control">

            <option>Data Structures</option>
            <option>Database Management</option>
            <option>Operating Systems</option>
            <option>Computer Networks</option>

        </select>

    </div>

    <div>
        <label>Period</label>

        <select
            id="period"
            class="form-control">

            <option>1st Period</option>
            <option>2nd Period</option>
            <option>3rd Period</option>
            <option>4th Period</option>

        </select>

    </div>

</div>

</div>

<div class="card">

<div class="page-header">

    <div class="search-box">

        <input
            type="text"
            id="studentSearch"
            placeholder="Search student..."
        >

    </div>

    <button
        class="btn btn-secondary"
        onclick="markAllPresent()">

        ✓ Mark All Present

    </button>

</div>

<div class="table-container">

<table>

<thead>

<tr>

<th>Roll No</th>
<th>Student</th>
<th>Attendance</th>
<th>Status</th>

</tr>

</thead>

<tbody id="attendanceTable">

</tbody>

</table>

</div>

</div>

<div class="card">

<div class="stats-grid">

<div class="stat-card">

<div class="stat-header">
Total Students
</div>

<div
    class="stat-value"
    id="totalStudents">
    0
</div>

</div>

<div class="stat-card">

<div class="stat-header">
Present
</div>

<div
    class="stat-value"
    id="presentCount">
    0
</div>

</div>

<div class="stat-card">

<div class="stat-header">
Absent
</div>

<div
    class="stat-value"
    id="absentCount">
    0
</div>

</div>

<div class="stat-card">

<div class="stat-header">
Percentage
</div>

<div
    class="stat-value"
    id="percentage">
    0%
</div>

</div>

</div>

<button
    class="btn btn-primary"
    onclick="saveAttendance()">

    Save Attendance

</button>

</div>

</section>

</main>

</div>

<div class="toast"></div>

<script src="data.js"></script>
<script src="common.js"></script>
<script src="attendance.js"></script>

</body>
</html>
