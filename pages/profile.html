<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile | Attendify</title>

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="app">

<aside class="sidebar">

    <div class="sidebar-brand">
        <div class="brand-icon">A</div>
        <h2>Attendify</h2>
    </div>

    <a href="dashboard.html" class="nav-item">
        📊 Dashboard
    </a>

    <a href="attendance.html" class="nav-item">
        ✓ Attendance
    </a>

    <a href="students.html" class="nav-item">
        👥 Students
    </a>

    <a href="subjects.html" class="nav-item">
        📚 Subjects
    </a>

    <a href="reports.html" class="nav-item">
        📈 Reports
    </a>

    <a href="history.html" class="nav-item">
        🕒 History
    </a>

    <a href="profile.html" class="nav-item active">
        👤 Profile
    </a>

    <a href="settings.html" class="nav-item">
        ⚙ Settings
    </a>

    <a href="#" onclick="logout()" class="nav-item">
        ⇥ Logout
    </a>

</aside>


<main class="main">

<header class="navbar">

    <button
        class="mobile-menu"
        onclick="toggleSidebar()">

        ☰

    </button>

    <div class="page-title">
        Profile
    </div>

    <div class="nav-right">

        <div class="notification">
            🔔
        </div>

        <div class="user">

            <div class="avatar">
                DG
            </div>

            <div class="user-info">

                <strong data-user-name>
                    Debadrita Goswami
                </strong>

                <small data-user-role>
                    CR
                </small>

            </div>

        </div>

    </div>

</header>


<section class="content">

<div class="page-header">

    <div>

        <h1>My Profile</h1>

        <p>
            Manage your personal information.
        </p>

    </div>

</div>


<div class="card">

    <div style="
        display:flex;
        align-items:center;
        gap:20px;
        margin-bottom:30px;
        flex-wrap:wrap;
    ">

        <div
            class="avatar"
            style="
                width:80px;
                height:80px;
                font-size:24px;
            ">

            DG

        </div>

        <div>

            <h2 data-user-name>
                Debadrita Goswami
            </h2>

            <p style="color:#64748b">
                Class Representative
            </p>

            <span class="badge badge-primary">
                CR
            </span>

        </div>

    </div>


    <form id="profileForm">

        <div class="grid-2">

            <div class="form-group">

                <label>Full Name</label>

                <input
                    class="form-control"
                    id="profileName"
                    value="Debadrita Goswami">

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    class="form-control"
                    id="profileEmail"
                    value="cr@attendify.com">

            </div>


            <div class="form-group">

                <label>Department</label>

                <input
                    class="form-control"
                    value="Computer Science & Engineering">

            </div>


            <div class="form-group">

                <label>Semester</label>

                <input
                    class="form-control"
                    value="5">

            </div>


            <div class="form-group">

                <label>Section</label>

                <input
                    class="form-control"
                    value="A">

            </div>


            <div class="form-group">

                <label>Roll Number</label>

                <input
                    class="form-control"
                    value="AU-CR-001"
                    disabled>

            </div>

        </div>


        <button
            type="submit"
            class="btn btn-primary">

            Save Changes

        </button>

    </form>

</div>

</section>

</main>

</div>


<div class="toast"></div>


<script src="../js/data.js"></script>
<script src="../js/common.js"></script>

<script>

setUserInfo();


document
    .getElementById("profileForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            showToast(
                "Profile updated successfully"
            );

        }
    );

</script>

</body>

</html>
